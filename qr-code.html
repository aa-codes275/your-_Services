<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#12030c" />
<title>رمز QR | Your Services</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="icon" type="image/png" href="logo-mark.png">
<link rel="stylesheet" href="style.css">
<style>
  .qr-wrap{min-height:100vh;display:grid;place-items:center;padding:26px 16px}
  .qr-card{width:min(430px,100%);padding:30px 26px;text-align:center;border-radius:30px;
    background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
    border:1px solid var(--stroke);backdrop-filter:blur(16px);box-shadow:var(--sh);position:relative;overflow:hidden}
  .qr-card::before{content:"";position:absolute;inset:-40% -20% auto -20%;height:260px;background:var(--grad);
    filter:blur(70px);opacity:.35}
  .qr-card>*{position:relative}
  .qr-card img.logo{width:96px;margin:0 auto 10px;filter:drop-shadow(0 10px 26px rgba(224,52,138,.6))}
  .qr-card h1{font-size:1.35rem;font-weight:900}
  .qr-card h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .qr-card p{color:var(--mut);font-size:.9rem;margin-top:8px}
  .frame{margin:22px auto 0;width:min(290px,86%);padding:14px;border-radius:28px;background:var(--grad);
    box-shadow:0 22px 50px -18px var(--c2);animation:glow 3.4s ease-in-out infinite}
  @keyframes glow{50%{box-shadow:0 26px 66px -14px var(--c3)}}
  .frame .inner{background:#fff;border-radius:20px;padding:12px;position:relative}
  .frame img#qrImg{width:100%;border-radius:10px;display:block}
  .frame .badge{position:absolute;inset-inline-end:-10px;bottom:-10px;width:46px;height:46px;border-radius:16px;
    background:#fff;display:grid;place-items:center;box-shadow:0 10px 24px -10px rgba(0,0,0,.6)}
  .frame .badge img{width:32px}
  .linkbox{margin-top:22px;display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;
    background:rgba(255,255,255,.06);border:1px solid var(--stroke);font-size:.85rem;text-align:start}
  .linkbox span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr}
  .linkbox button{border:0;background:var(--grad);color:#fff;font:inherit;font-weight:700;font-size:.8rem;
    padding:8px 12px;border-radius:12px;cursor:pointer;flex:0 0 auto}
  .qr-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:18px}
  .qr-actions .btn{flex:1 1 150px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:999px;
    font:inherit;font-weight:700;font-size:.88rem;cursor:pointer;border:1px solid var(--stroke);
    background:rgba(255,255,255,.06);color:var(--txt);transition:.25s}
  .btn.primary{background:var(--grad);border-color:transparent;color:#fff}
  .btn:hover{transform:translateY(-3px)}
  .hint{margin-top:16px;font-size:.76rem;color:var(--mut)}
</style>
</head>
<body>
<div class="aurora"><span></span><span></span><span></span></div>

<div class="qr-wrap">
  <main class="qr-card">
    <img class="logo" src="logo-mark.png" alt="Your Services" />
    <h1>امسح الكود وادخل على <span>Your Services</span></h1>
    <p>وجّه كاميرا الجوال على الرمز للوصول الفوري لدليل الشركات والموظفين والتقييمات.</p>

    <div class="frame">
      <div class="inner">
        <img id="qrImg" src="" alt="QR Code — Your Services" />
        <span class="badge"><img src="logo-mark.png" alt="" /></span>
      </div>
    </div>

    <div class="linkbox">
      <i class="fa-solid fa-link" style="color:var(--c3)"></i>
      <span id="siteUrlTxt">—</span>
      <button id="copyBtn">نسخ</button>
    </div>

    <div class="qr-actions">
      <a class="btn primary" id="openBtn" href="index.html"><i class="fa-solid fa-arrow-up-right-from-square"></i> فتح الموقع</a>
      <a class="btn" id="dlBtn" download="your-services-qr.png"><i class="fa-solid fa-download"></i> تحميل الكود</a>
    </div>

    <p class="hint"><i class="fa-solid fa-shield-halved"></i> الرمز يحتوي على رابط الموقع فقط — آمن للمشاركة والطباعة.</p>
  </main>
</div>

<script>
  var siteUrl = window.location.origin + window.location.pathname.replace(/qr-code\.html?$/i, 'index.html');
  document.getElementById('siteUrlTxt').textContent = siteUrl;
  document.getElementById('openBtn').href = siteUrl;
  var qr = 'https://api.qrserver.com/v1/create-qr-code/?size=520x520&margin=8&color=7D1F4A&bgcolor=FFFFFF&data=' + encodeURIComponent(siteUrl);
  document.getElementById('qrImg').src = qr;
  document.getElementById('dlBtn').href = qr;
  document.getElementById('copyBtn').onclick = function () {
    navigator.clipboard.writeText(siteUrl).then(() => {
      this.textContent = 'تم النسخ ✓';
      setTimeout(() => { this.textContent = 'نسخ'; }, 1800);
    });
  };
</script>
</body>
</html>
