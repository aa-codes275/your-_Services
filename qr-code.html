<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<title>رمز QR | Your Services</title>
<meta name="description" content="امسح رمز QR للوصول الفوري لمنصة Your Services — دليل الشركات والخبراء والتقييمات." />
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="style.css">
<style>
  .qr-wrap{min-height:100dvh;display:grid;place-items:center;padding:28px 16px}
  .qr-card{width:min(440px,100%);padding:34px 26px 30px;text-align:center;border-radius:34px;
    background:#fff;border:1px solid var(--stroke);box-shadow:0 40px 90px -50px rgba(125,31,74,.55);
    position:relative;overflow:hidden}
  .qr-card::before{content:"";position:absolute;inset:-45% -25% auto -25%;height:300px;
    background:var(--grad);filter:blur(80px);opacity:.16}
  .qr-card::after{content:"";position:absolute;inset:auto -30% -50% -30%;height:260px;
    background:var(--grad2);filter:blur(80px);opacity:.12}
  .qr-card>*{position:relative}
  .qr-card img.logo{width:110px;margin:0 auto 12px;filter:drop-shadow(0 14px 26px rgba(216,27,96,.28))}
  .qr-card h1{font-size:1.35rem;font-weight:900;line-height:1.5}
  .qr-card h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .qr-card p.sub{color:var(--mut);font-size:.9rem;margin-top:8px}

  .frame{margin:24px auto 0;width:min(300px,88%);padding:16px;border-radius:32px;background:var(--grad);
    box-shadow:0 26px 55px -26px var(--c2);position:relative}
  .frame .inner{background:#fff;border-radius:22px;padding:14px;position:relative}
  .frame img#qrImg{width:100%;border-radius:12px;display:block}
  .corner{position:absolute;width:26px;height:26px;border:3px solid rgba(255,255,255,.9);border-radius:8px}
  .corner.tl{top:8px;left:8px;border-left-width:3px;border-top-width:3px;border-right:0;border-bottom:0}
  .corner.tr{top:8px;right:8px;border-right-width:3px;border-top-width:3px;border-left:0;border-bottom:0}
  .corner.bl{bottom:8px;left:8px;border-left-width:3px;border-bottom-width:3px;border-right:0;border-top:0}
  .corner.br{bottom:8px;right:8px;border-right-width:3px;border-bottom-width:3px;border-left:0;border-top:0}
  .frame .badge{position:absolute;inset-inline-end:-12px;bottom:-12px;width:56px;height:56px;border-radius:20px;
    background:#fff;display:grid;place-items:center;box-shadow:0 14px 28px -14px rgba(125,31,74,.6);
    border:1px solid var(--stroke)}
  .frame .badge img{width:38px}

  .linkbox{margin-top:26px;display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;
    background:#fff8fb;border:1px solid var(--stroke);font-size:.85rem;text-align:start}
  .linkbox span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;color:var(--txt)}
  .linkbox button{border:0;background:var(--grad2);color:#fff;font:inherit;font-weight:700;font-size:.8rem;
    padding:8px 13px;border-radius:12px;cursor:pointer;flex:0 0 auto}
  .qr-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px}
  .qr-actions .btn{flex:1 1 150px}
  .qr-socials{margin-top:20px;padding-top:18px;border-top:1px solid var(--stroke)}
  .hint{margin-top:16px;font-size:.76rem;color:var(--mut)}
</style>
</head>
<body>
<div class="aurora"><span></span><span></span><span></span></div>

<div class="qr-wrap">
  <main class="qr-card">
    <img class="logo" src="logo-mark.png" alt="Your Services" />
    <h1>امسح الكود وادخل على <span>Your Services</span></h1>
    <p class="sub">وجّه كاميرا جوالك على الرمز للوصول الفوري لدليل الشركات والموظفين والتقييمات.</p>

    <div class="frame">
      <span class="corner tl"></span><span class="corner tr"></span>
      <span class="corner bl"></span><span class="corner br"></span>
      <div class="inner">
        <img id="qrImg" src="" alt="QR Code — Your Services" />
        <span class="badge"><img src="logo-mark.png" alt="" /></span>
      </div>
    </div>

    <div class="linkbox">
      <i class="fa-solid fa-link" style="color:var(--c2)"></i>
      <span id="siteUrlTxt">—</span>
      <button id="copyBtn">نسخ</button>
    </div>

    <div class="qr-actions">
      <a class="btn btn-glow" id="openBtn" href="#"><i class="fa-solid fa-arrow-up-right-from-square"></i> فتح الموقع</a>
      <a class="btn btn-ghost" id="dlBtn" download="your-services-qr.png"><i class="fa-solid fa-download"></i> تحميل الكود</a>
    </div>

    <div class="socials qr-socials">
      <a class="wa" href="https://wa.me/966500000000" target="_blank" rel="noopener" title="واتساب"><i class="fa-brands fa-whatsapp"></i></a>
      <a class="ig" href="https://instagram.com/" target="_blank" rel="noopener" title="انستجرام"><i class="fa-brands fa-instagram"></i></a>
      <a class="tt" href="https://tiktok.com/" target="_blank" rel="noopener" title="تيك توك"><i class="fa-brands fa-tiktok"></i></a>
      <a class="tw" href="https://twitter.com/" target="_blank" rel="noopener" title="تويتر / X"><i class="fa-brands fa-x-twitter"></i></a>
      <a class="sc" href="https://snapchat.com/" target="_blank" rel="noopener" title="سناب شات"><i class="fa-brands fa-snapchat"></i></a>
      <a class="ml" href="mailto:info@yourservices.com" title="البريد الإلكتروني"><i class="fa-solid fa-envelope"></i></a>
    </div>

    <p class="hint"><i class="fa-solid fa-shield-halved"></i> الرمز يحتوي على رابط الموقع فقط — آمن للمشاركة والطباعة.</p>
  </main>
</div>

<script>
  var siteUrl = "https://aa-codes275.github.io/your-_Services/";
  document.getElementById('siteUrlTxt').textContent = siteUrl;
  document.getElementById('openBtn').href = siteUrl;

  var qr = 'https://api.qrserver.com/v1/create-qr-code/?size=620x620&margin=10&color=7D1F4A&bgcolor=FFFFFF&data=' + encodeURIComponent(siteUrl);
  document.getElementById('qrImg').src = qr;
  document.getElementById('dlBtn').href = qr;

  document.getElementById('copyBtn').onclick = function () {
    var b = this;
    navigator.clipboard.writeText(siteUrl).then(function(){
      b.textContent = 'تم النسخ ✓';
      setTimeout(function(){ b.textContent = 'نسخ'; }, 1800);
    });
  };
</script>
</body>
</html>
